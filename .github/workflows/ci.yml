name: CI

# The integration suite is gated by TEST_DATABASE_URL and TEST_REDIS_URL, so it
# only proves anything when real PostgreSQL and Redis servers are present. This
# workflow provides both and then asserts that the adapter tests executed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        # Pinned minor version; the service is ephemeral, so every run starts
        # from an empty cluster and cannot leak state into the next run.
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: task_manager
          POSTGRES_PASSWORD: task_manager
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_manager -d task_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        # Ephemeral cache only. Match Compose: disable RDB snapshots and AOF so
        # the service never writes durable state during the job. The container
        # itself is also discarded when the job ends.
        image: redis:7.4-alpine
        # Same args as compose.yaml (`redis-server --save "" --appendonly no`).
        # entrypoint overrides the image script so these flags reach redis-server.
        entrypoint: redis-server
        command: --save "" --appendonly no
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Test-only credentials for the ephemeral service container above. They
      # grant access to nothing outside this job and are not secrets.
      #
      # DATABASE_URL is deliberately absent: the configuration tests assert the
      # unset defaults, and only the migration step exports it.
      TEST_DATABASE_URL: postgres://task_manager:task_manager@localhost:5432/task_manager_test?sslmode=disable
      # Dedicated logical database and unique key prefixes keep cache tests
      # isolated from any other data on the service container.
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt would change these files:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Same Redocly invocation as `make openapi-lint` / the README; no Go dep.
      - name: Lint OpenAPI document
        run: make openapi-lint

      # The infrastructure-free tier: both integration variables are cleared so
      # the adapter tests skip exactly as they do on a machine without them.
      - name: Unit tests (infrastructure-free)
        env:
          TEST_DATABASE_URL: ""
          TEST_REDIS_URL: ""
        run: go test -count=1 ./...

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: go run ./cmd/migrate

      # make test-integration refuses to run without both variables, so a
      # missing one fails here instead of producing a green, empty run.
      - name: Integration tests (PostgreSQL and Redis)
        run: make test-integration

      # A skip would still exit 0, so prove that the database-backed tests ran
      # and passed. Capture go test's exit status so a FAIL cannot be masked by
      # later greps; required PASS lines and an anti-SKIP check still apply.
      - name: Assert PostgreSQL tests ran
        run: |
          set -euo pipefail
          # Disable -e only around the pipeline so a failing go test does not
          # abort before PASS/SKIP checks; PIPESTATUS must be read before any
          # later command (including `|| true`) overwrites it.
          set +e
          go test -count=1 -v -run 'TestCreatePersistsTask|TestMigrateIsIdempotent' \
            ./internal/task/repository/postgres ./internal/infra/database \
            | tee /tmp/postgres-assert.out
          status=${PIPESTATUS[0]}
          set -e
          grep -q -- '--- PASS: TestCreatePersistsTask' /tmp/postgres-assert.out
          grep -q -- '--- PASS: TestMigrateIsIdempotent' /tmp/postgres-assert.out
          if grep -q -- '--- SKIP' /tmp/postgres-assert.out; then
            echo "PostgreSQL integration tests were skipped despite TEST_DATABASE_URL being set" >&2
            exit 1
          fi
          exit "${status}"

      # Redis tests skip without TEST_REDIS_URL, which would still exit 0. Prove
      # the real-Redis suite ran (full TestRedisCache selection), that the
      # representative cases passed, that none skipped, and that go test itself
      # exited 0 so a sibling FAIL cannot greenwash the step.
      - name: Assert Redis tests ran
        run: |
          set -euo pipefail
          set +e
          go test -count=1 -v -run 'TestRedisCache' ./internal/task/cache/redis \
            | tee /tmp/redis-assert.out
          status=${PIPESTATUS[0]}
          set -e
          grep -q -- '--- PASS: TestRedisCacheMissThenHit' /tmp/redis-assert.out
          grep -q -- '--- PASS: TestRedisCacheStaleRefillRace' /tmp/redis-assert.out
          if grep -q -- '--- SKIP' /tmp/redis-assert.out; then
            echo "Redis integration tests were skipped despite TEST_REDIS_URL being set" >&2
            exit 1
          fi
          exit "${status}"

      # Packages share one database and Redis instance, so they run sequentially
      # (-p 1) to keep schema, table, and key state from interleaving.
      - name: Race detector against PostgreSQL and Redis
        run: go test -race -count=1 -p 1 ./...

      # The gate measures the combined unit + integration suite, because the
      # PostgreSQL and Redis adapters only execute when their test URLs are set.
      # The threshold itself lives in the Makefile, not in this workflow.
      - name: Coverage gate
        run: make coverage-check

      - name: Build Docker image
        run: docker build --tag task-manager:ci .

      # The runtime stage must not fall back to root if the USER line regresses.
      - name: Verify the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id task-manager:ci -u)" = "10001"

      - name: Validate Compose configuration
        run: docker compose config --quiet
