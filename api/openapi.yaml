openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: |
    HTTP contract for the Task Manager service.

    The API is unauthenticated. All task errors use the same JSON envelope:

    ```json
    {"error":{"code":"validation_error","message":"invalid task data","fields":{"title":"title is required"}}}
    ```

    `fields` is optional and appears only when a validation failure can be
    attributed to specific request fields. A request body must be exactly one
    JSON object; unknown fields and trailing JSON values are rejected.

    Task failures and route-level failures use this envelope. Health endpoints
    keep their documented operational shapes for `200` and `503`; an undefined
    method on a health path still returns the envelope. Undefined methods on a
    known path return `405` with the `method_not_allowed` code, and unknown
    paths return `404` with the `not_found` code.
security: []
servers:
  - url: /
    description: The current host, whether local or containerized.
tags:
  - name: Tasks
    description: Create, read, replace, and delete tasks.
  - name: Health
    description: Operational readiness and liveness probes.
paths:
  /tasks:
    get:
      tags:
        - Tasks
      operationId: listTasks
      summary: List tasks
      description: |
        Returns every task ordered by `id` ascending. An empty collection is
        returned as `[]`, never `null`.
      responses:
        '200':
          description: The task collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
              examples:
                empty:
                  summary: No tasks
                  value: []
                populated:
                  summary: One task
                  value:
                    - id: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
                      title: Write the report
                      description: Cover the API contract.
                      status: todo
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Tasks
      operationId: createTask
      summary: Create a task
      description: |
        Creates a task and returns it with a server-assigned UUID. `title` is
        required and trimmed of leading and trailing whitespace before storage;
        `description` defaults to an empty string, is stored as sent, and
        `status` defaults to `todo`.
      requestBody:
        required: true
        description: The task to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
            examples:
              minimal:
                summary: Title only
                value:
                  title: Write the report
              complete:
                summary: All writable fields
                value:
                  title: Write the report
                  description: Cover the API contract.
                  status: in_progress
      responses:
        '201':
          description: The task was created.
          headers:
            Location:
              description: The path of the created task.
              schema:
                type: string
                example: /tasks/6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                created:
                  summary: Created task
                  value:
                    id: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
                    title: Write the report
                    description: Cover the API contract.
                    status: todo
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags:
        - Tasks
      operationId: getTask
      summary: Get a task
      description: Returns a single task by its UUID.
      responses:
        '200':
          description: The requested task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                found:
                  summary: Existing task
                  value:
                    id: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
                    title: Write the report
                    description: Cover the API contract.
                    status: todo
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Tasks
      operationId: replaceTask
      summary: Replace a task
      description: |
        Replaces the mutable fields of an existing task. This is a full
        replacement: omitted `description` and `status` values take their
        defaults (`""` and `todo`), and the `id` cannot be supplied or changed.
        The response is the stored task.
      requestBody:
        required: true
        description: The complete replacement values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
            examples:
              replace:
                summary: Replacement values
                value:
                  title: Write the final report
                  description: Include the OpenAPI contract.
                  status: done
      responses:
        '200':
          description: The task was replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                replaced:
                  summary: Replaced task
                  value:
                    id: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
                    title: Write the final report
                    description: Include the OpenAPI contract.
                    status: done
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Tasks
      operationId: deleteTask
      summary: Delete a task
      description: Deletes a task by its UUID. The response has no body.
      responses:
        '204':
          description: The task was deleted.
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Readiness probe
      description: |
        Pings the configured database with a two-second budget. This is a
        connectivity check only; schema presence is verified at startup. When
        no database checker is wired (test-only construction), the response is
        `503` with `database not configured`.
      responses:
        '200':
          description: The database answered the ping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                ready:
                  summary: Database reachable
                  value:
                    database: ok
                    status: ok
        '503':
          description: The database is unreachable, the ping timed out, or no checker is wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthError'
              examples:
                unreachable:
                  summary: Database unreachable
                  value:
                    error: database unreachable
                    status: error
                unconfigured:
                  summary: No checker wired
                  value:
                    error: database not configured
                    status: error
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /health/live:
    get:
      tags:
        - Health
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is running without touching the database.
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              examples:
                alive:
                  summary: Process running
                  value:
                    status: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: The task UUID.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
  responses:
    BadRequest:
      description: |
        The request body is malformed or fails validation, or a path identifier
        is not a UUID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidJson:
              summary: Malformed JSON
              value:
                error:
                  code: invalid_request
                  message: request body must be a valid JSON object
            validation:
              summary: Field validation failed
              value:
                error:
                  code: validation_error
                  message: invalid task data
                  fields:
                    title: title is required
                    status: 'status must be one of: todo, in_progress, done'
    InvalidTaskId:
      description: The path identifier is not a UUID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidId:
              summary: Malformed task ID
              value:
                error:
                  code: validation_error
                  message: invalid task id
                  fields:
                    id: must be a UUID
    TaskNotFound:
      description: No task exists with the supplied UUID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              summary: Unknown task
              value:
                error:
                  code: not_found
                  message: task not found
    MethodNotAllowed:
      description: The path exists but does not support this HTTP method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            methodNotAllowed:
              summary: Unsupported method
              value:
                error:
                  code: method_not_allowed
                  message: method not allowed
    InternalError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              summary: Unexpected failure
              value:
                error:
                  code: internal_error
                  message: internal server error
  schemas:
    Task:
      type: object
      description: A stored task.
      required:
        - id
        - title
        - description
        - status
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Server-assigned identifier.
          example: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
        title:
          type: string
          description: Short task title. Leading and trailing whitespace is removed.
          example: Write the report
        description:
          type: string
          description: Optional longer description, stored as sent. Defaults to an empty string.
          example: Cover the API contract.
        status:
          $ref: '#/components/schemas/TaskStatus'
    TaskWrite:
      type: object
      description: |
        Writable task fields. The body must contain exactly one JSON object;
        unknown fields are rejected. `title` is required; `description` and
        `status` default to `""` and `todo`.
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          description: Short task title. Whitespace-only values are rejected.
          example: Write the report
        description:
          type: string
          default: ''
          description: Optional longer description, stored as sent.
          example: Cover the API contract.
        status:
          allOf:
            - $ref: '#/components/schemas/TaskStatus'
          default: todo
          description: Workflow status.
    TaskStatus:
      type: string
      description: A task's workflow state.
      enum:
        - todo
        - in_progress
        - done
    TaskList:
      type: array
      description: Tasks ordered by `id` ascending.
      items:
        $ref: '#/components/schemas/Task'
    ErrorResponse:
      type: object
      description: The error envelope for task failures and route-level 404/405 responses.
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - code
            - message
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              enum:
                - invalid_request
                - validation_error
                - not_found
                - method_not_allowed
                - internal_error
            message:
              type: string
              description: Human-readable error message.
              example: invalid task data
            fields:
              type: object
              description: Field-specific validation messages, when applicable.
              additionalProperties:
                type: string
              example:
                title: title is required
    HealthReady:
      type: object
      required:
        - status
        - database
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
        database:
          type: string
          enum:
            - ok
    HealthError:
      type: object
      required:
        - status
        - error
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - error
        error:
          type: string
          description: Human-readable readiness failure.
          enum:
            - database unreachable
            - database not configured
    Liveness:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
