openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: |
    HTTP contract for the Task Manager service.

    The API is unauthenticated. All task errors use the same JSON envelope:

    ```json
    {"error":{"code":"validation_error","message":"invalid task data","fields":{"title":"title is required"}}}
    ```

    `fields` is optional and appears only when a validation failure can be
    attributed to specific request fields. A request body must be exactly one
    JSON object; unknown fields and trailing JSON values are rejected.

    Task failures and route-level failures use this envelope. Health endpoints
    keep their documented operational shapes for `200` and `503`; an undefined
    method on a health path still returns the envelope. Undefined methods on a
    known path return `405` with the `method_not_allowed` code, and unknown
    paths return `404` with the `not_found` code.
security: []
servers:
  - url: /
    description: The current host, whether local or containerized.
tags:
  - name: Tasks
    description: Create, read, replace, and delete tasks.
  - name: Health
    description: Operational readiness and liveness probes.
paths:
  /tasks:
    get:
      tags:
        - Tasks
      operationId: listTasks
      summary: List, filter, and paginate tasks
      description: |
        Returns one page of tasks ordered by `id` ascending. The identifier is
        unique, so the ordering is deterministic and pages never overlap for a
        fixed data set. Ordering is by identifier, not by creation time.

        Filters are applied before pagination and before the total is counted,
        and the page and its `total` come from the same filtered set. An empty
        result is returned as `"items": []`, never `null`. A page beyond the
        last one returns the correct `total` and an empty `items` array rather
        than an error.

        `page` defaults to 1 and must be at least 1. `page_size` defaults to 20
        and must be between 1 and 100. Out-of-range values, unknown query
        parameters, and unsupported status values are rejected with `400` and
        the standard error envelope; nothing is silently clamped, ignored, or
        defaulted over.

        Equivalent requests share one cache entry: the assignee filter is
        trimmed, and an omitted parameter is the same as its documented
        default. Every successful task mutation invalidates all cached pages.
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/AssigneeFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of matching tasks and its pagination metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
              examples:
                empty:
                  summary: No tasks
                  value:
                    items: []
                    page: 1
                    page_size: 20
                    total: 0
                    total_pages: 0
                populated:
                  summary: First page with defaults
                  value:
                    items:
                      - id: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
                        title: Write the report
                        description: Cover the API contract.
                        status: todo
                        assignee: alice
                    page: 1
                    page_size: 20
                    total: 1
                    total_pages: 1
                filtered:
                  summary: Second page of alice's done tasks
                  value:
                    items:
                      - id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                        title: Review the contract
                        description: ''
                        status: done
                        assignee: alice
                    page: 2
                    page_size: 1
                    total: 3
                    total_pages: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /task:
    post:
      tags:
        - Tasks
      operationId: createTask
      summary: Create a task
      description: |
        Creates a task and returns it with a server-assigned UUID. `title` is
        required and trimmed of leading and trailing whitespace before storage;
        `description` defaults to an empty string, is stored as sent, `status`
        defaults to `todo`, and `assignee` defaults to an empty label and is
        trimmed.

        Creation is served at `/task`; the collection path `/tasks` is
        read-only. The created task is returned with a `Location` header
        pointing at `/tasks/{id}`, which is where it can be read, replaced, and
        deleted.
      requestBody:
        required: true
        description: The task to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
            examples:
              minimal:
                summary: Title only
                value:
                  title: Write the report
              complete:
                summary: All writable fields
                value:
                  title: Write the report
                  description: Cover the API contract.
                  status: in_progress
                  assignee: alice
      responses:
        '201':
          description: The task was created.
          headers:
            Location:
              description: The path of the created task.
              schema:
                type: string
                example: /tasks/6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                created:
                  summary: Created task
                  value:
                    id: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
                    title: Write the report
                    description: Cover the API contract.
                    status: todo
                    assignee: alice
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags:
        - Tasks
      operationId: getTask
      summary: Get a task
      description: Returns a single task by its UUID.
      responses:
        '200':
          description: The requested task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                found:
                  summary: Existing task
                  value:
                    id: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
                    title: Write the report
                    description: Cover the API contract.
                    status: todo
                    assignee: alice
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
        - Tasks
      operationId: replaceTask
      summary: Replace a task
      description: |
        Replaces the mutable fields of an existing task. This is a full
        replacement: omitted `description`, `status`, and `assignee` values take
        their defaults (`""`, `todo`, `""`), and the `id` cannot be supplied or
        changed. The response is the stored task.
      requestBody:
        required: true
        description: The complete replacement values.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskWrite'
            examples:
              replace:
                summary: Replacement values
                value:
                  title: Write the final report
                  description: Include the OpenAPI contract.
                  status: done
                  assignee: bob
      responses:
        '200':
          description: The task was replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                replaced:
                  summary: Replaced task
                  value:
                    id: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
                    title: Write the final report
                    description: Include the OpenAPI contract.
                    status: done
                    assignee: bob
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Tasks
      operationId: deleteTask
      summary: Delete a task
      description: Deletes a task by its UUID. The response has no body.
      responses:
        '204':
          description: The task was deleted.
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Readiness probe
      description: |
        Pings the configured database with a two-second budget. This is a
        connectivity check only; schema presence is verified at startup. When
        no database checker is wired (test-only construction), the response is
        `503` with `database not configured`.
      responses:
        '200':
          description: The database answered the ping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              examples:
                ready:
                  summary: Database reachable
                  value:
                    database: ok
                    status: ok
        '503':
          description: The database is unreachable, the ping timed out, or no checker is wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthError'
              examples:
                unreachable:
                  summary: Database unreachable
                  value:
                    error: database unreachable
                    status: error
                unconfigured:
                  summary: No checker wired
                  value:
                    error: database not configured
                    status: error
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /health/live:
    get:
      tags:
        - Health
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is running without touching the database.
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              examples:
                alive:
                  summary: Process running
                  value:
                    status: ok
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: The task UUID.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
        example: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
    StatusFilter:
      name: status
      in: query
      required: false
      description: |
        Return only tasks in this status. Omitted means any status. The value is
        matched exactly and must be one of the documented statuses; anything
        else is a `400`, not an empty result.
      schema:
        $ref: '#/components/schemas/TaskStatus'
    AssigneeFilter:
      name: assignee
      in: query
      required: false
      description: |
        Return only tasks assigned to exactly this label (case-sensitive).
        Leading and trailing whitespace is trimmed, and the value must be 1-100
        characters. Omitted means any assignee; this version cannot filter for
        unassigned tasks alone.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        example: alice
    Page:
      name: page
      in: query
      required: false
      description: |
        One-based page number. Defaults to 1. A page beyond the last one is a
        valid request and returns an empty `items` array with the correct
        totals.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 2
    PageSize:
      name: page_size
      in: query
      required: false
      description: Maximum number of tasks in one page. Defaults to 20; the largest accepted value is 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
  responses:
    BadRequest:
      description: |
        The request body is malformed or fails validation, a path identifier is
        not a UUID, or a query parameter is unsupported or out of range.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidJson:
              summary: Malformed JSON
              value:
                error:
                  code: invalid_request
                  message: request body must be a valid JSON object
            validation:
              summary: Field validation failed
              value:
                error:
                  code: validation_error
                  message: invalid task data
                  fields:
                    title: title is required
                    status: 'status must be one of: todo, in_progress, done'
            queryValidation:
              summary: Invalid query parameters
              value:
                error:
                  code: validation_error
                  message: invalid query parameters
                  fields:
                    page_size: must be at most 100
    InvalidTaskId:
      description: The path identifier is not a UUID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidId:
              summary: Malformed task ID
              value:
                error:
                  code: validation_error
                  message: invalid task id
                  fields:
                    id: must be a UUID
    TaskNotFound:
      description: No task exists with the supplied UUID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              summary: Unknown task
              value:
                error:
                  code: not_found
                  message: task not found
    MethodNotAllowed:
      description: The path exists but does not support this HTTP method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            methodNotAllowed:
              summary: Unsupported method
              value:
                error:
                  code: method_not_allowed
                  message: method not allowed
    InternalError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              summary: Unexpected failure
              value:
                error:
                  code: internal_error
                  message: internal server error
  schemas:
    Task:
      type: object
      description: A stored task.
      required:
        - id
        - title
        - description
        - status
        - assignee
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Server-assigned identifier.
          example: 6f1c2a4e-8d3b-4f5a-9c7e-1a2b3c4d5e6f
        title:
          type: string
          description: Short task title. Leading and trailing whitespace is removed.
          example: Write the report
        description:
          type: string
          description: Optional longer description, stored as sent. Defaults to an empty string.
          example: Cover the API contract.
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee:
          type: string
          description: |
            Who owns the task, as a free-form label. Empty when unassigned.
            Trimmed of leading and trailing whitespace; at most 100 characters.
          example: alice
    TaskWrite:
      type: object
      description: |
        Writable task fields. The body must contain exactly one JSON object;
        unknown fields are rejected. `title` is required; `description`,
        `status`, and `assignee` default to `""`, `todo`, and `""`.
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          description: Short task title. Whitespace-only values are rejected.
          example: Write the report
        description:
          type: string
          default: ''
          description: Optional longer description, stored as sent.
          example: Cover the API contract.
        status:
          allOf:
            - $ref: '#/components/schemas/TaskStatus'
          default: todo
          description: Workflow status.
        assignee:
          type: string
          maxLength: 100
          default: ''
          description: |
            Optional owner label, trimmed before storage. Omitting it (or
            sending an empty string) stores the task as unassigned.
          example: alice
    TaskStatus:
      type: string
      description: A task's workflow state.
      enum:
        - todo
        - in_progress
        - done
    TaskPage:
      type: object
      description: One page of tasks with its pagination metadata.
      required:
        - items
        - page
        - page_size
        - total
        - total_pages
      additionalProperties: false
      properties:
        items:
          type: array
          description: |
            Tasks in this page, ordered by `id` ascending. `[]` when the page is
            empty or beyond the last page; never `null`.
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
          minimum: 1
          description: Echoes the requested page number.
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          description: Echoes the effective page size.
          example: 20
        total:
          type: integer
          format: int64
          minimum: 0
          description: |
            Number of tasks matching the filters before pagination. It is the
            same for every page of one filtered result.
          example: 42
        total_pages:
          type: integer
          minimum: 0
          description: |
            Number of pages the filtered result occupies
            (`ceil(total / page_size)`). Zero when nothing matches.
          example: 3
    ErrorResponse:
      type: object
      description: The error envelope for task failures and route-level 404/405 responses.
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - code
            - message
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              enum:
                - invalid_request
                - validation_error
                - not_found
                - method_not_allowed
                - internal_error
            message:
              type: string
              description: Human-readable error message.
              example: invalid task data
            fields:
              type: object
              description: Field-specific validation messages, when applicable.
              additionalProperties:
                type: string
              example:
                title: title is required
    HealthReady:
      type: object
      required:
        - status
        - database
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
        database:
          type: string
          enum:
            - ok
    HealthError:
      type: object
      required:
        - status
        - error
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - error
        error:
          type: string
          description: Human-readable readiness failure.
          enum:
            - database unreachable
            - database not configured
    Liveness:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
